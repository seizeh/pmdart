# Android 빌드 게이트 — Gradle/플러그인 깨짐을 로컬 릴리즈 빌드 전에 잡는다.
#
# ci.yml 과 분리한 이유:
#   · 웹 배포(deploy-web.yml)가 workflow_run 으로 "CI" 의 **전체 결론**을 본다 —
#     Android 만 깨졌을 때 웹 배포까지 막히는 결합을 만들지 않는다.
#   · PR 필수 체크(analyze-and-test)의 피드백 속도를 유지한다. PR 에서는
#     android/ 나 의존성을 건드린 경우에만 돈다.
#
# --debug 인 이유: 릴리즈 서명키는 CI 에 없고(taskGraph 가드가 릴리즈를 막는다),
# 여기서 잡으려는 것은 서명이 아니라 Gradle 설정·플러그인 호환 깨짐이다.
name: Android 빌드

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: APK 빌드(debug)
        run: flutter build apk --debug

      - name: 결과
        run: echo "APK 빌드 통과 — $(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
