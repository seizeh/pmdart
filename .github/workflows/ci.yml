# CI — PR/메인 푸시마다 정적 분석 + 위젯 테스트.
# 셀프 머지 환경에서 최소한의 머지 게이트 역할을 한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # 커버리지 스티키 코멘트
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 포맷 게이트. 예외 없음 — post_create_screen.dart 임시 제외는 해당 WIP 가
      # 머지되면서 해제했다(#160).
      - name: 포맷 검사
        run: |
          git ls-files | grep -E '^(lib|test)/.*\.dart$' \
            | xargs dart format --output=none --set-exit-if-changed

      # info 수준 린트는 실패로 치지 않는다(warning/error 만 게이트).
      - run: flutter analyze --no-fatal-infos

      - run: flutter test --coverage

      # 커버리지 산출물 — lcov 원본 + 브라우저로 보는 HTML 리포트(30일 보관).
      # 래칫 게이트보다 앞에 둔다: 게이트에 걸린 날일수록 리포트가 필요하다.
      - name: 커버리지 HTML 리포트
        run: |
          sudo apt-get -qq update && sudo apt-get -qq -y install lcov >/dev/null
          genhtml -q coverage/lcov.info -o coverage/html
      - name: 커버리지 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/html
          retention-days: 30

      # 커버리지 요약 + 하한 게이트(래칫 — 커버리지가 오르는 만큼 하한을 따라 올린다).
      #
      # 걸렸을 때 하한을 내리지 않는다. 래칫의 값은 숫자가 아니라 "내려갈 수 없다" 는
      # 성질에서 나오고, 급할 때 한 번 내리면 그 성질이 사라져 다음부터는 그냥 주석이다.
      # 실제로 커버 줄은 늘어도 전체가 더 빨리 늘어 비율이 밀리는 국면이 있다
      # (17.8% → 17.7%). 그때 할 일은 하한 조정이 아니라 새 코드에 테스트를 쓰는 것이다.
      # 정말 못 지키겠으면 하한을 고치지 말고 왜 예외인지를 PR 에 적고 리뷰를 받는다.
      # ADR 0007 참고.
      - name: 커버리지 요약·게이트(≥18%)
        shell: bash
        run: |
          awk -F'[:,]' '/^DA:/{t++; if($3>0) h++}
            END{pct=h*100/t; printf "라인 커버리지 %.1f%% (%d/%d)\n", pct, h, t;
                exit (pct>=18)?0:1}' \
            coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

      # PR 코멘트 — 전체 % + **이 PR 이 바꾼 파일들의 커버리지**. 베이스라인
      # 없이도 "변경분에 테스트가 따라왔는가" 가 보인다. 스티키(같은 코멘트 갱신).
      - name: 커버리지 PR 코멘트
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | grep -E '^lib/.*\.dart$' > /tmp/changed.txt || true
          python3 tool/cov_report.py coverage/lcov.info /tmp/changed.txt > /tmp/comment.md
          marker='<!-- coverage-report -->'
          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -F body=@/tmp/comment.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@/tmp/comment.md >/dev/null
          fi

      # `catch (_)` 래칫 — 커버리지 래칫과 같은 방식(docs/error-policy.md).
      # 예외를 삼키는 것 자체가 문제가 아니라 **판단이 런타임에 흔적을 안 남기는 것**이
      # 문제였다. 남은 곳을 한 번에 못 고치니 늘어나지 않게 못 박고 줄여 간다.
      # 새 코드는 ErrorReporter.ignored/userFacing/report 셋 중 하나를 쓴다.
      - name: catch (_) 래칫(≤104)
        shell: bash
        run: |
          n=$(git ls-files 'lib/**.dart' | xargs grep -o 'catch (_)' | wc -l | tr -d ' ')
          echo "catch (_) $n곳 (상한 104)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 104 ]; then
            echo "::error::catch (_) 가 늘었습니다($n > 104). docs/error-policy.md 의 세 등급 중 하나를 쓰세요."
            git ls-files 'lib/**.dart' | xargs grep -n 'catch (_)' | head -20
            exit 1
          fi

      # 파일 크기 래칫 — 커버리지·catch (_) 래칫과 같은 방식(#155 God Widget).
      # 현재 최대 파일(business_register_screen.dart 2,100줄)을 상한으로 고정해
      # "더 큰 화면이 새로 생기는 것"부터 막고, 분리가 진행되는 만큼 상한을 내린다.
      # 파일을 쪼개는 방법은 docs/architecture-state.md 의 상태 홀더 패턴 참고.
      - name: 파일 크기 래칫(≤2100줄)
        shell: bash
        run: |
          max=$(git ls-files 'lib/**.dart' | xargs wc -l | sed '$d' | sort -rn | head -1)
          n=$(echo "$max" | awk '{print $1}')
          f=$(echo "$max" | awk '{print $2}')
          echo "최대 파일 $n줄 — $f (상한 2100)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 2100 ]; then
            echo "::error::lib/ 파일이 2,100줄을 넘었습니다($f: $n줄). 화면 분리(상태 홀더/위젯 추출) 후 다시 올리세요."
            exit 1
          fi

      # `dart:io` 금지 게이트 — 웹에서 컴파일은 되지만 Platform.isIOS 등이 런타임에
      # UnsupportedError 를 던진다(빌드로는 안 잡히고 흰 화면으로만 드러남).
      # 플랫폼 판별은 lib/utils/platform_info.dart, 파일 조작은 조건부 import 파사드로.
      - name: dart:io 직접 사용 금지
        shell: bash
        run: |
          hits=$(git ls-files | grep -E '^lib/.*\.dart$' \
            | grep -v '^lib/utils/temp_file_io\.dart$' \
            | xargs grep -ln "^import 'dart:io'" || true)
          if [ -n "$hits" ]; then
            echo "dart:io 를 직접 import 한 파일 — docs/web-port.md 참고:"
            echo "$hits"
            exit 1
          fi

      # 웹 빌드 게이트 — 앱 쪽 변경이 웹 번들을 조용히 깨는 것을 막는다.
      # (런타임 회귀까지는 못 잡는다. 위 dart:io 게이트가 그 몫을 일부 담당.)
      - name: 웹 빌드
        run: flutter build web --release --no-wasm-dry-run
