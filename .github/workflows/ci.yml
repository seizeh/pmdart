# CI — PR/메인 푸시마다 정적 분석 + 위젯 테스트.
# 셀프 머지 환경에서 최소한의 머지 게이트 역할을 한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # info 수준 린트는 실패로 치지 않는다(warning/error 만 게이트).
      - run: flutter analyze --no-fatal-infos

      - run: flutter test --coverage

      # 라인 커버리지 요약(아직 게이트 아님 — 측정·가시화 단계).
      - name: 커버리지 요약
        run: |
          awk -F'[:,]' '/^DA:/{t++; if($3>0) h++}
            END{printf "라인 커버리지 %.1f%% (%d/%d)\n", h*100/t, h, t}' \
            coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"
