# CI — PR/메인 푸시마다 정적 분석 + 위젯 테스트.
# 셀프 머지 환경에서 최소한의 머지 게이트 역할을 한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 포맷 게이트. post_create_screen.dart 만 일시 제외 — 진행 중 작업(WIP·PR #143)과
      # 겹쳐 있어 해당 작업 머지 후 포맷하고 제외를 풀 것.
      - name: 포맷 검사
        run: |
          git ls-files | grep -E '^(lib|test)/.*\.dart$' \
            | grep -v '^lib/screen/post_create_screen\.dart$' \
            | xargs dart format --output=none --set-exit-if-changed

      # info 수준 린트는 실패로 치지 않는다(warning/error 만 게이트).
      - run: flutter analyze --no-fatal-infos

      - run: flutter test --coverage

      # 커버리지 요약 + 하한 게이트(래칫 — 커버리지가 오르는 만큼 하한을 따라 올린다).
      #
      # 걸렸을 때 하한을 내리지 않는다. 래칫의 값은 숫자가 아니라 "내려갈 수 없다" 는
      # 성질에서 나오고, 급할 때 한 번 내리면 그 성질이 사라져 다음부터는 그냥 주석이다.
      # 실제로 커버 줄은 늘어도 전체가 더 빨리 늘어 비율이 밀리는 국면이 있다
      # (17.8% → 17.7%). 그때 할 일은 하한 조정이 아니라 새 코드에 테스트를 쓰는 것이다.
      # 정말 못 지키겠으면 하한을 고치지 말고 왜 예외인지를 PR 에 적고 리뷰를 받는다.
      # ADR 0007 참고.
      - name: 커버리지 요약·게이트(≥17%)
        shell: bash
        run: |
          awk -F'[:,]' '/^DA:/{t++; if($3>0) h++}
            END{pct=h*100/t; printf "라인 커버리지 %.1f%% (%d/%d)\n", pct, h, t;
                exit (pct>=17)?0:1}' \
            coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

      # `catch (_)` 래칫 — 커버리지 래칫과 같은 방식(docs/error-policy.md).
      # 예외를 삼키는 것 자체가 문제가 아니라 **판단이 런타임에 흔적을 안 남기는 것**이
      # 문제였다. 남은 곳을 한 번에 못 고치니 늘어나지 않게 못 박고 줄여 간다.
      # 새 코드는 ErrorReporter.ignored/userFacing/report 셋 중 하나를 쓴다.
      - name: catch (_) 래칫(≤110)
        shell: bash
        run: |
          n=$(git ls-files 'lib/**.dart' | xargs grep -o 'catch (_)' | wc -l | tr -d ' ')
          echo "catch (_) $n곳 (상한 110)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 110 ]; then
            echo "::error::catch (_) 가 늘었습니다($n > 110). docs/error-policy.md 의 세 등급 중 하나를 쓰세요."
            git ls-files 'lib/**.dart' | xargs grep -n 'catch (_)' | head -20
            exit 1
          fi

      # `dart:io` 금지 게이트 — 웹에서 컴파일은 되지만 Platform.isIOS 등이 런타임에
      # UnsupportedError 를 던진다(빌드로는 안 잡히고 흰 화면으로만 드러남).
      # 플랫폼 판별은 lib/utils/platform_info.dart, 파일 조작은 조건부 import 파사드로.
      - name: dart:io 직접 사용 금지
        shell: bash
        run: |
          hits=$(git ls-files | grep -E '^lib/.*\.dart$' \
            | grep -v '^lib/utils/temp_file_io\.dart$' \
            | xargs grep -ln "^import 'dart:io'" || true)
          if [ -n "$hits" ]; then
            echo "dart:io 를 직접 import 한 파일 — docs/web-port.md 참고:"
            echo "$hits"
            exit 1
          fi

      # 웹 빌드 게이트 — 앱 쪽 변경이 웹 번들을 조용히 깨는 것을 막는다.
      # (런타임 회귀까지는 못 잡는다. 위 dart:io 게이트가 그 몫을 일부 담당.)
      - name: 웹 빌드
        run: flutter build web --release --no-wasm-dry-run
