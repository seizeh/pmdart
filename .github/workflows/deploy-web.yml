# 웹 배포 — main 에 웹 결과물이 바뀌는 변경이 들어오면 Cloudflare Pages 로 배포.
#
# 수동 배포를 대체한다. 손으로 하면 아래 두 가지를 매번 기억해야 하는데, 빠뜨려도
# 빌드는 성공하고 품질만 조용히 나빠져서 눈치채기 어렵다(docs/web-port.md).
#   · --no-web-resources-cdn 을 빼면 CanvasKit 이 gstatic 에서 오면서 한글이
#     몇 초간 두부(□)로 보인다.
#   · .symbols 를 안 지우면 런타임에 안 쓰는 8MB 를 매번 올린다.
name: 웹 배포

on:
  push:
    branches: [main]
    # 웹 산출물에 영향이 있는 것만 — 문서·pmdb 문서 변경으로는 배포하지 않는다.
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: # 코드 변경 없이 다시 배포하고 싶을 때

# 연속 푸시 시 마지막 것만 배포 — 앞선 배포가 뒤엣것을 덮어쓰지 않게.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 시크릿이 없으면 wrangler 가 알 수 없는 오류로 죽는다 — 먼저 명확히 알린다.
      - name: 시크릿 확인
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::저장소 시크릿이 없습니다:$missing"
            echo "Settings → Secrets and variables → Actions 에서 추가하세요."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # ⚠️ --no-web-resources-cdn 은 선택이 아니다(위 주석 참고).
      #
      # SENTRY_DSN 은 **없어도 된다.** 시크릿 미설정이면 빈 문자열이 주입되고
      # Observability.bootstrap 이 초기화를 통째로 건너뛴다 — 종전과 동일하게 동작한다
      # (jusoApiKey·webPushVapidKey 와 같은 관용구). 켜려면 저장소 시크릿에
      # SENTRY_DSN 만 추가하면 되고 워크플로는 그대로 둔다.
      #
      # ⚠️ 웹에서 이벤트가 실제로 나가려면 web/_headers 의 connect-src 에
      #    https://*.sentry.io 가 있어야 한다 — 없으면 CSP 가 조용히 막는다.
      #
      # APP_RELEASE 는 Sentry 대시보드에서 이벤트를 배포 단위로 묶는 값이다.
      # pubspec 의 version 을 그대로 쓴다(예: pawmate@2.0.0+10).
      - name: 웹 빌드
        run: |
          release="pawmate@$(grep -E '^version:' pubspec.yaml | awk '{print $2}')"
          echo "release: $release"
          flutter build web --release --no-web-resources-cdn \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}" \
            --dart-define=SENTRY_ENVIRONMENT=production \
            --dart-define=APP_RELEASE="$release"

      # 런타임에 쓰지 않는 디버그 심볼(약 8MB) 제거.
      - name: 디버그 심볼 제거
        run: find build/web/canvaskit -name '*.symbols' -delete

      - name: Cloudflare Pages 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name pawmate-web --branch main

      - name: 결과
        run: echo "배포 완료 — https://app.pawmate.kr" >> "$GITHUB_STEP_SUMMARY"
